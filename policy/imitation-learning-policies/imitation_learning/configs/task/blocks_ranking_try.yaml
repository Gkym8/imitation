defaults:
  - rmbench
  - _self_

workspace:
  train_dataset:
    image_keys: [head_camera]
    dataloader_cfg:
      batch_size: 8
  model:
    denoising_network_partial:
      max_history_len: 16
      shadow_horizon: 3
  trainer:
    num_epochs: 301
    checkpoint_every: 50
    future_prediction_loss_weight: 0.05
    streaming_chunk_length: 8

visual_encoder:
    spatial_merge_size: [8,4]
