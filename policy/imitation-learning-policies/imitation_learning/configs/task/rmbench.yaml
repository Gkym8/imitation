defaults:
  - _self_

dataset_type: rmbench

visual_encoder:
  _target_: imitation_learning.models.encoders.image_encoders.SharedDinoV2ImageEncoder
  model_name: facebook/dinov2-with-registers-base
  input_size: 224
  apply_image_norm: true
  pretrained: true
  frozen: true
  individual_forward: false
  spatial_merge_size: 8
  patch_merge: false
  state_query_merge: true

workspace:
  train_dataset: 
    name: rmbench
    robot_num: 2
    repeat_dataset_num: 1
    starting_percentile_max: 1.0
    anchor_sampling_mode: streaming
    image_keys: [head_camera]
    # true: preserve the existing offline cached-feature training path.
    # false: load raw images and backpropagate through the current/history DINO.
    use_cached_image_features: false
    cached_image_feature_kind: ${cond:${oc.select:visual_encoder.state_query_merge,false},patches,${cond:${oc.select:visual_encoder.patch_merge,false},patches,auto}}
    cached_image_feature_dim: 768
    cached_image_feature_patch_token_num: 256
    cached_image_feature_model_name: ${visual_encoder.model_name}
    cached_image_feature_input_size: ${visual_encoder.input_size}
    cached_image_feature_dtype: float32
    dataloader_cfg:
      batch_size: 8

  model:
    image_indices: [0]
    image_length: 1
    proprio_indices: [0]
    proprio_length: 1
    action_length: 16
    action_indices: ${range:0,${workspace.model.action_length}}
    execution_chunk_length: 10
    # pooled: mean(h) -> future CLS; tokens: h -> future patch tokens.
    # Patch targets use visual_encoder.spatial_merge_size, like memory slots.
    future_prediction_mode: pooled
    denoising_network_partial:
      use_conditioned_slot_gate: true
      hidden_dim: 512
      max_history_len: 8

  trainer:
    streaming_chunk_length: 4
    streaming_chunk_accumulate: 1
    num_epochs: 301
    checkpoint_every: 50
    rollout_every: 0
    sample_every: 0
    val_every: 25
