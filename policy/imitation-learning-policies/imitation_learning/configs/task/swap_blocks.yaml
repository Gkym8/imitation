defaults:
  - rmbench
  - _self_

workspace:
  train_dataset:
    image_keys: [head_camera]
    dataloader_cfg:
      batch_size: 8
  model:
    denoising_network_partial:
      max_history_len: 8
      shadow_horizon: 3
    memory_bank_type: gate
  trainer:
    num_epochs: 301
    checkpoint_every: 50

visual_encoder:
    spatial_merge_size: [8,4]
