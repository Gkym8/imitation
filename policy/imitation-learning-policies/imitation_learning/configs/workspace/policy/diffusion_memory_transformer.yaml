defaults:
  - diffusion_transformer
  - cond_encoder@history_img_feature_encoder: multi_token_encoder
  - cond_encoder@future_img_feature_encoder: multi_token_encoder
  - future_prediction@future_feature_predictor: future_feature_predictor
  - override denoising_network@denoising_network_partial: memory_transformer
  - _self_

_target_: imitation_learning.policies.history_denoising_policy.HistoryDenoisingPolicy

# Keep the old cached-feature path available while allowing raw-image online
# training when the task config sets use_cached_image_features=false.
use_cached_image_features: ${workspace.train_dataset.use_cached_image_features}

skip_memory: false
global_cond_encoder:
  image_encoder_partial:
    spatial_merge_size: ${visual_encoder.spatial_merge_size}

history_img_feature_encoder:
  image_encoder_partial:
    feature_aggregation: patches
    spatial_merge_size: ${visual_encoder.spatial_merge_size}
    frozen: ${visual_encoder.frozen}
  name: history_img_feature_encoder
  data_entry_names: ${workspace.train_dataset.image_keys}

future_img_feature_encoder:
  image_encoder_partial:
    # Future prediction keeps the original one-token CLS/MAP target.
    feature_aggregation: map
    spatial_merge_size: ${visual_encoder.spatial_merge_size}
    # The future target is always produced by an independent frozen encoder.
    frozen: true
    shared_model_key: ${cond:${workspace.train_dataset.use_cached_image_features},${visual_encoder.model_name},future_target_dinov2}
  name: future_img_feature_encoder
  data_entry_names: ${workspace.train_dataset.image_keys}

future_prediction_context_pooling: mean
execution_chunk_length: 10

prediction_error_queue:
  enabled: true
  capacity: 20
  warmup_min_samples: 5
  warmup_min_std: 0.003
  epsilon: 1.0e-6
  weight_min: -0.5
  weight_max: 0.5

dynamic_memory_weight_update:
  enabled: true
  step_size: 100.0
  evict_lowest: true
  first_weight: 0.5
  keep_first: true
  keep_recent: 2
  record_stats: false
  record_weights: false

training_bias: true
inference_bias: true
