defaults:
  - diffusion_transformer
  - cond_encoder@history_img_feature_encoder: multi_token_encoder
  - cond_encoder@future_img_feature_encoder: multi_token_encoder
  - future_prediction@future_feature_predictor: future_feature_predictor
  - override denoising_network@denoising_network_partial: memory_transformer
  - _self_

_target_: imitation_learning.policies.history_denoising_policy.HistoryDenoisingPolicy

use_cached_image_features: ${workspace.train_dataset.use_cached_image_features}

skip_memory: false
global_cond_encoder:
  image_encoder_partial:
    spatial_merge_size: ${visual_encoder.spatial_merge_size}

history_img_feature_encoder:
  image_encoder_partial:
    feature_aggregation: patches
    spatial_merge_size: ${visual_encoder.spatial_merge_size}
    frozen: ${visual_encoder.frozen}
  name: history_img_feature_encoder
  data_entry_names: ${workspace.train_dataset.image_keys}

future_img_feature_encoder:
  image_encoder_partial:
    feature_aggregation: ${eval:"dict(pooled='map', tokens='patches')['${workspace.model.future_prediction_mode}']"}
    spatial_merge_size: ${visual_encoder.spatial_merge_size}
    frozen: true
    # A frozen backbone can serve current/history inputs and future targets.
    # Keep targets separate only when the online backbone is trainable.
    shared_model_key: ${cond:${visual_encoder.frozen},${visual_encoder.model_name},future_target_dinov2}
  name: future_img_feature_encoder
  data_entry_names: ${workspace.train_dataset.image_keys}

future_prediction_mode: pooled
future_prediction_context_pooling: ${eval:"dict(pooled='mean', tokens='none')['${workspace.model.future_prediction_mode}']"}
execution_chunk_length: 10

memory_eviction:
  keep_first: true
  keep_recent: 2

gate_selectivity_min_std: 0.1
