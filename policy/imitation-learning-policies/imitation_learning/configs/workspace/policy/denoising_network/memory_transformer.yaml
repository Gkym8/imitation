defaults:
  - conditional_transformer
  - _self_

_target_: imitation_learning.models.denoising_networks.memory_transformer.MemoryTransformer

max_history_len: 8

# absolute & relative
history_time_encoding: relative
# Training only; inference always hard-deletes the minimum eligible gate slot.
shadow_window: true
# Keep the demotion Gate for this many reads; read k uses saved_gate * scale**k.
shadow_horizon: 10
shadow_gate_scale: 0.5

fusion_gate: true

query_tokens: 12

freeze_non_history_modules: false
history_attention_type: token_wise
memory_retrieval_mode: perception_patches
perception_retrieval_layers: 2
use_conditioned_slot_gate: true
slot_gate_hidden_dim: 128
slot_gate_bias_init: 0.0
record_data_entries: []
record_history_attention_epoch_stats: false
ssmax_scaling_param: null
add_additional_self_attn: true
skip_history_attn: false
