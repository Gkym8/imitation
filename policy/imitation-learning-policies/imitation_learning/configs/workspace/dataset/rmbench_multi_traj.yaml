defaults:
  - rmbench_single_traj
  - _self_

_target_: imitation_learning.datasets.rmbench_dataset.RMBenchMultiTrajDataset

# Training anchor sampling:
#   contiguous - fixed-interval windows with a bounded anchor count.
#   streaming  - cover each valid anchor in fixed-interval phase streams;
#                carry causal memory and truncate gradients between chunks.
anchor_sampling_mode: streaming

# Streaming computes its padded stream length from the dataset and ignores
# this window length after initialization.
traj_num: ${eval:"2*${workspace.model.denoising_network_partial.max_history_len}"}

# Match training anchors to the number of actions executed per decision.
# The experiment value is defined once in the policy/task YAML.
traj_interval_min: ${workspace.model.execution_chunk_length}
traj_interval_max: ${workspace.model.execution_chunk_length}
episode_starting_idx_max: null
starting_percentile_max: 1.0
# contiguous uses this random-sample budget. streaming
# ignores it and creates exactly one sample per valid phase (per repeat).
index_pool_size_per_episode: 100
repeat_dataset_num: 1

dataloader_cfg:
  batch_size: 4
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 1

split_dataloader_cfg:
  batch_size: 4
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  shuffle: false
  prefetch_factor: 1
