defaults:
  - mikasa_single_traj
  - _self_

_target_: imitation_learning.datasets.mikasa_dataset.MikasaMultiTrajDataset

anchor_sampling_mode: streaming
# Inclusive episode-frame range for stream starts; null keeps original phases.
sample_range: null
# Streaming derives its actual length from each episode, independent of bank size.
traj_num: 1
traj_interval_min: ${workspace.model.execution_chunk_length}
traj_interval_max: ${workspace.model.execution_chunk_length}
starting_percentile_max: 1.0
index_pool_size_per_episode: -1
repeat_dataset_num: 1

dataloader_cfg:
  batch_size: 8

split_dataloader_cfg:
  batch_size: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  shuffle: false
  prefetch_factor: 1
