defaults:
  - base_trainer
  - ../env@rollout_env: remote_env
  - _self_

_target_: imitation_learning.trainers.policy_trainer.PolicyTrainer

checkpoint_manager:
  sort_key: "train/mean_loss"
  keep_min: True

finetune_keywords:
  - shared_model_manager # Vision models
  # - history_img_feature_encoder # For finetuning the last layer of siglip

regular_keywords: [] 
skip_saving_keywords: [] 
keep_saving_keywords: [] 
rollout_every: 0 
future_prediction_loss_weight: 0.05
critical_action_loss_weights: [0.0] 
streaming_chunk_length: 4
streaming_chunk_accumulate: 1
