# This is the outmost config file that is directly filled by the command arguments
# Please pass all arguments with + prefix

# policy_name: ???
# task_name: ???
# task_yaml_name: ??? # Optional; defaults to task_name.

# project_name: ???
# logger_project_name: ???
# run_name: ??? # Complete dataset/seed name plus an optional experiment tag.
# run_name_suffix: ??? # "_<run_name>"; supplied by train.sh for directory names.
# train_server_name: ???

workspace:
  name: ${task_name}_${policy_name}
  # train_dataset:
  #   name: ???
  #   root_dir: ???
  #   compressed_dir: ???
  #   normalizer_dir: ???
hydra:
  run:
    dir: outputs/${task_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}${run_name_suffix}

# Other overrides from the run command will be added here
